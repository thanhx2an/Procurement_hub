_schema-version: "3.1"
ID: baongoc-procurement-hub-app
version: 1.0.0
description: Multi-Vendor Collaborative Procurement & Logistics Hub

modules:
  # ─── CAP Backend ───
  - name: baongoc-procurement-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 1024M
      memory: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: baongoc-auth
      - name: baongoc-db
      - name: baongoc-destination
      - name: vendor-portal-api
        group: destinations
        properties:
          name: vendor-portal
          url: ~{url}
          forwardAuthToken: false
      - name: baongoc-connectivity
      - name: POC2_alertNotification

  # ─── HANA DB Deployer ───
  - name: baongoc-procurement-hub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: baongoc-db

  # ─── React Frontend ───
  - name: baongoc-vendor-portal
    type: nodejs
    path: app/vendor-portal
    provides:
      - name: vendor-portal-api
        properties:
          url: ${default-url}
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
    parameters:
      buildpack: staticfile_buildpack
      disk-quota: 512M
      memory: 128M
    requires:
      - name: baongoc-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # AppRouter
  - name: baongoc-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      disk-quota: 256M
      memory: 256M
    properties:
      TENANT_HOST_PATTERN: "^(.*)-dev-baongoc-approuter.cfapps.us10-001.hana.ondemand.com"
      UAA_SERVICE_NAME: baongoc-auth
    requires:
      - name: baongoc-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      - name: vendor-portal-api
        group: destinations
        properties:
          name: vendor-portal
          url: ~{url}
          forwardAuthToken: false

      - name: baongoc-destination

resources:
  # ─── XSUAA ───
  - name: baongoc-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: baongoc-auth
      path: ./xs-security.json

  # ─── HANA Cloud ───
  - name: baongoc-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: baongoc-db

  # ─── Destination Service ───
  - name: baongoc-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: baongoc-destination

  # ─── Connectivity ───
  - name: baongoc-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
      service-name: baongoc-connectivity

  - name: POC2_alertNotification
    type: org.cloudfoundry.existing-service



    